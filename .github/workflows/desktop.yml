name: Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-opengl
            runner: windows-2022
            host: windows
            arch: win64_msvc2022_64
            renderer: OPENGL
          - id: linux-opengl
            runner: ubuntu-24.04
            host: linux
            arch: linux_gcc_64
            renderer: OPENGL
          - id: macos-opengl
            runner: macos-15-intel
            host: mac
            arch: clang_64
            renderer: OPENGL
          - id: macos-metal
            runner: macos-15-intel
            host: mac
            arch: clang_64
            renderer: METAL
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl1-mesa-dev

      - name: Select Xcode 16.4
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.12.0'
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.arch }}
          archives: qtbase qtdeclarative qtsvg qttools qttranslations
          modules: qttasktree qtshadertools
          setup-python: false
          # This upstream revision understands the Qt 6.11+ Windows compiler folders.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
          py7zrversion: '==1.1.3'
          cache: true
          cache-key-prefix: osm-qt612-v1

      - name: Configure Windows Release
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}"
          -DBUILD_TESTING=ON -DOSM_GRAPH_BACKEND=${{ matrix.renderer }}

      - name: Configure Unix Release
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}"
          -DBUILD_TESTING=ON -DOSM_GRAPH_BACKEND=${{ matrix.renderer }}

      - name: Build Release
        run: cmake --build build --config Release --parallel 2

      - name: Check QML
        run: cmake --build build --config Release --target all_qmllint

      - name: Run device-independent tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Stage application
        if: runner.os != 'Windows'
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/build/stage"

      - name: Stage Windows application and compiler runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'MSVC installation not found' }
          $env:VCINSTALLDIR = Join-Path $vsPath 'VC'
          cmake --install build --config Release --prefix "${{ github.workspace }}/build/stage"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath build/stage/bin/vc_redist.x64.exe)) {
            throw 'The staged application is missing the MSVC runtime installer'
          }

      - name: Include license
        run: cmake -E copy LICENSE build/stage/LICENSE

      # Tar preserves executable permissions and macOS framework symlinks.
      - name: Archive staged application
        working-directory: build/stage
        run: cmake -E tar cf "${{ github.workspace }}/OpenSoundMeter-${{ matrix.id }}.tar" --format=gnutar .

      - name: Upload application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenSoundMeter-${{ matrix.id }}
          path: OpenSoundMeter-${{ matrix.id }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.id }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
